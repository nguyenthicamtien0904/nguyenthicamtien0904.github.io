<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cẩm Tiên Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; }
        header { background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; }
        .navbar { max-width: 1100px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: 700; color: #2563eb; text-decoration: none; }
        .cart-btn { background: #2563eb; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 9999px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .cart-badge { background: #ef4444; color: white; font-size: 0.75rem; padding: 0.15rem 0.45rem; border-radius: 9999px; }
        .banner { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; text-align: center; padding: 3rem 1.5rem; }
        .banner h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
        .product-desc { font-size: 0.88rem; color: #64748b; margin-bottom: 1rem; flex-grow: 1; }
        .product-bottom { display: flex; align-items: center; justify-content: space-between; }
        .product-price { font-size: 1.15rem; font-weight: 700; color: #ef4444; }
        .add-to-cart { background: #2563eb; color: white; border: none; padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 99; display: none; }
        .cart-overlay.open { display: block; }
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 100%; max-width: 380px; height: 100vh; background: white; z-index: 100; transition: right 0.3s; display: flex; flex-direction: column; }
        .cart-drawer.open { right: 0; }
        .cart-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .close-cart { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .cart-footer { padding: 1.5rem; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; }
        .checkout-btn { width: 100%; background: #16a34a; color: white; border: none; padding: 0.85rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        footer { background: #ffffff; border-top: 1px solid #e2e8f0; text-align: center; padding: 1.5rem; color: #64748b; margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <div class="navbar">
            <a href="#" class="logo">🛍️ Cẩm Tiên Store</a>
            <button class="cart-btn" onclick="toggleCart()">
                🛒 Giỏ hàng (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <div class="banner">
        <h1>Chào mừng bạn đến với Cẩm Tiên Store</h1>
        <p>Sản phẩm chất lượng - Giao hàng nhanh chóng - Giá cả ưu đãi</p>
    </div>

    <div class="container">
        <h2 class="section-title">Sản Phẩm Nổi Bật</h2>
        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Giỏ Hàng Của Bạn</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p style="text-align: center; color: #64748b;">Giỏ hàng đang trống.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Tổng cộng:</span>
                <span id="cartTotalPrice" style="color: #ef4444;">0 ₫</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Thanh Toán Ngay</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Cẩm Tiên Store. Tất cả các quyền được bảo lưu.</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Tai nghe Không Dây Pro", price: 450000, desc: "Chống ồn chủ động, pin 24 giờ liên tục.", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" },
            { id: 2, name: "Đồng Hồ Thông Minh Sport", price: 890000, desc: "Đo nhịp tim, chống nước chuẩn 5ATM.", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
            { id: 3, name: "Bàn Phím Cơ Không Dây RGB", price: 750000, desc: "Switch gõ êm, kết nối đa thiết bị.", img: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&q=80" },
            { id: 4, name: "Chuột Gaming Công Thái Học", price: 320000, desc: "Cảm biến quang học chính xác cao.", img: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500&q=80" }
        ];

        let cart = [];

        function renderProducts() {
            document.getElementById("productGrid").innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" class="product-img">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-bottom">
                            <span class="product-price">${p.price.toLocaleString('vi-VN')} ₫</span>
                            <button class="add-to-cart" onclick="addToCart(${p.id})">+ Thêm</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById("cartCount").textContent = cart.length;
            const cartItems = document.getElementById("cartItems");
            if (cart.length === 0) {
                cartItems.innerHTML = '<p style="text-align: center; color: #64748b; margin-top: 2rem;">Giỏ hàng đang trống.</p>';
            } else {
                cartItems.innerHTML = cart.map((item, idx) => `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.5rem;">
                        <div>
                            <div style="font-weight: 600; font-size: 0.9rem;">${item.name}</div>
                            <div style="color: #ef4444; font-size: 0.85rem;">${item.price.toLocaleString('vi-VN')} ₫</div>
                        </div>
                        <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#ef4444; cursor:pointer;">Xóa</button>
                    </div>
                `).join('');
            }
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById("cartTotalPrice").textContent = total.toLocaleString('vi-VN') + ' ₫';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById("cartDrawer").classList.toggle("open");
            document.getElementById("cartOverlay").classList.toggle("open");
        }

        function checkout() {
            if (cart.length === 0) {
                alert("Giỏ hàng của bạn đang trống!");
                return;
            }
            alert("Đặt hàng thành công! Cảm ơn bạn đã mua sắm tại Cẩm Tiên Store.");
            cart = [];
            updateCartUI();
            toggleCart();
        }

        renderProducts();
    </script>
</body>
</html>
